<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ulavan Tech — Inspection History</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b5e20">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <span class="logo-mark">🌿</span>
        <div>
          <h1>Ulavan Tech</h1>
          <p class="logo-tagline">Tamil Nadu Crop Health Scanner</p>
        </div>
      </a>
      <div id="lang-wrap"></div>
    </div>
    <nav class="nav">
      <a href="index.html" data-i18n="nav_home">Home</a>
      <a href="detection.html" data-i18n="nav_detection">Detection</a>
      <a href="history.html" data-i18n="nav_history">History</a>
      <a href="about.html" data-i18n="nav_project">Project</a>
      <a href="settings.html" data-i18n="nav_settings">AI Settings</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-title">
      <h2 data-i18n="history_title">Inspection history</h2>
      <p data-i18n="history_desc">A digital record of every palm screen — one of the four project objectives (digital record for all 110 palms).</p>
    </section>

    <div class="history-toolbar" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px">
      <input id="history-search" type="search" placeholder="Search crop, palm ID, zone or finding" data-i18n-attr="placeholder|history_search_ph" aria-label="Search records" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem">
      <select id="history-risk" aria-label="Filter by risk" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem">
        <option value="all" data-i18n="risk_all">All risks</option>
        <option value="low" data-i18n="risk_low">Low</option>
        <option value="medium" data-i18n="risk_medium">Medium</option>
        <option value="high" data-i18n="risk_high">High</option>
      </select>
      <select id="history-method" aria-label="Filter by method" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem">
        <option value="all" data-i18n="method_all">All methods</option>
        <option value="local" data-i18n="method_local">On-device image check</option>
        <option value="model" data-i18n="method_model">Python AI model</option>
        <option value="vision" data-i18n="method_vision">AI vision model</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)">
        <input id="history-due" type="checkbox"> <span data-i18n="due_rechecks">Due rechecks</span>
      </label>
      <button id="export-history" class="btn secondary" type="button" data-i18n="export_csv">Export CSV</button>
      <button id="sync-history" class="btn" type="button" data-i18n="sync_history">Sync history</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <p id="count" style="color:var(--muted);font-size:.9rem"></p>
      <button id="clear-all" class="btn danger" data-i18n="clear_demo">Clear demo data</button>
    </div>

    <section id="history-list" class="history-list"></section>
  </main>

<script src="problems.js"></script>
  <script src="langs.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="history.js"></script>
  <script src="chat-key.js"></script>
  <script src="chatbot.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
